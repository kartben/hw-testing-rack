# hw-testing-rack as a Zephyr module: the boards (bay_node, power_hub), the
# devicetree bindings, the CH224A driver and the code both applications
# share, all under firmware/.  In the workspace made from firmware/west.yml
# west finds it by itself (this repository is the manifest repository), so
# sysbuild finds the boards and the signing key option too; each
# application also adds it with ZEPHYR_EXTRA_MODULES, so a plain build
# works from any Zephyr workspace.
name: hw-testing-rack
build:
  cmake: firmware/common
  kconfig: firmware/common/Kconfig
  sysbuild-kconfig: firmware/common/Kconfig.sysbuild
  settings:
    board_root: firmware
    dts_root: firmware
    snippet_root: firmware
