# Patches to the Zephyr pinned in firmware/west.yml, until Zephyr has them.
# After `west update`, in the workspace:
#
#   west patch apply
#
# (`west patch list` shows them, `west patch reverse` takes them out.)  A
# patch file is a series of Zephyr commits made with `git format-patch
# --stdout`, as they would go upstream; after regenerating one, update its
# sha256sum (`sha256sum zephyr/patches/<path>`).  Patch files are kept byte
# for byte (.gitattributes: -text).  Commits that touch the same lines stay
# in one file: `west patch apply` checks each file alone to tell whether it
# is applied already.

patches:
  # USB/IP: a device that goes ends its connection instead of leaving it on
  # freed memory, hubs are not on offer, an exported device cannot be
  # imported twice, bus IDs by port ("1-1", "1-1.3" behind port 3 of a hub),
  # an unlink is answered once the transfer ends, USB serial converters are
  # read ahead, the application can list the imported devices, requests
  # larger than the buffer pool go through it in segments, a mass storage
  # read is sent as its segments come (docs/multi-dut-node.md,
  # firmware/common/tests/usbip)
  - path: zephyr/usbip-removal-and-busid.patch
    sha256sum: d6df177242e6f6be12074a8d568d68e5760f42e0383ef5d60fc8c40159631e35
    module: zephyr
    author: Benjamin Cabé
    email: benjamin@zephyrproject.org
    date: 2026-10-19
    upstreamable: true
    comments: |
      Thirteen commits, each building on its own.  The first two overlap the
      maintainer's open PR 104189 (transfer allocation, cleanup when a
      submission fails): drop them when it lands.  The eighth (2026-10-21):
      an unlink answered with -ECONNRESET while its transfer completed made
      the client drop the device on the bench.  The ninth (2026-10-22):
      CONFIG_USBIP_READ_AHEAD and usbip_set_read_ahead_cb(), a transfer kept
      queued on a serial converter's bulk IN so its FIFO does not overflow
      while the client's next read crosses the network (the FT232 losing
      bytes on the bench); the bay node picks the converters by VID and PID
      (src/usb_host.c).  The tenth (2026-10-22): usbip_get_sessions() and
      usbip_device_offered(), for the bay page's USB devices card.  The
      eleventh (2026-10-22): CONFIG_USBIP_SEGMENT_SIZE, a request larger
      than the pool (a mass storage device gets up to 120 KB) held in PSRAM
      and sent through the pool a segment at a time (16 KB with PSRAM,
      firmware/bay-node/Kconfig).  The twelfth (2026-10-26): the next
      segment is queued before the data of the last one is handled, and on
      a Bulk-Only mass storage interface a read is sent to the client as
      each segment completes, after a reply that claims the requested
      length; an early end of the data stage is filled, and the command
      status wrapper tells the client (Bulk-Only Transport 1.0, 6.7.2).
      USB and Wi-Fi then overlap: 2x on the XIAO bench, same data (SHA-256).
      The thirteenth (2026-10-26): CONFIG_USBIP_RECV_WINDOW, the receive
      window of a connection that imports a device (SO_RCVBUF), for its
      writes, apart from the window of the other connections.
      Not proposed upstream (the user's call, 2026-10-19).

  # DWC2 host (the ESP32-S3's 8 channels): an interrupt IN endpoint gives its
  # channel back between polls, a bulk IN that NAKs gives it to transfers
  # waiting for one, the endpoint state is kept by device address and freed
  # when a device takes the address over, only consecutive transaction errors
  # fail a transfer, a cancelled transfer keeps its data toggle, a bulk
  # transfer longer than the channel counters hold goes in several runs
  # (docs/multi-dut-node.md, USB host channels; docs/data-x4-v2-research.md,
  # second pass)
  - path: zephyr/uhc-dwc2-channels.patch
    sha256sum: 258b9ac2b72d420a6ac48b9ba8a20057557cbbb0af9ad7c5da915ef08d3cdf2a
    module: zephyr
    author: Benjamin Cabé
    email: benjamin@zephyrproject.org
    date: 2026-10-19
    upstreamable: true
    comments: |
      Eleven commits.  The first five are the user's open PRs, as they are:
      120961 (which carries 120848) and 121688; drop each with its PR when
      it lands.  The next three are new, built on them: endpoint state by
      address, interrupt IN parked between polls, bulk IN parked on NAK
      while transfers wait.  The last two (2026-10-21): only consecutive
      transaction errors fail a transfer, a cancelled transfer keeps its
      data toggle.  The eleventh (2026-10-22): the ESP32-S3's channel counts
      127 packets at most, and a 16 KB mass storage read (256 packets) made
      the node panic; a channel is now programmed with what its counters
      hold and the transfer goes on in the next run.  That one, ported onto
      main, is the user's draft PR 123165 (2026-10-22): drop it when it
      lands.  The others are not proposed upstream (the user's call).

  # USB host hub class: the connection is debounced before a port reset, the
  # end of the reset is polled, and a port whose resets all failed is reset
  # again only on a new connection (the MCU-Link reset loop on the bench,
  # firmware/common/tests/usbh_hub)
  - path: zephyr/usbh-hub-port-reset.patch
    sha256sum: 1f4927ea8f195365ff8ee2e1a4c2a94f9256d557e46e7402b889cdbe28347a31
    module: zephyr
    author: Benjamin Cabé
    email: benjamin@zephyrproject.org
    date: 2026-10-21
    upstreamable: true
    comments: |
      Three commits, from the USB 2.0 timings (TATTDB, TRSTRCY).  Tested on
      native_sim against a made-up hub, not yet on the bench.  The same commits are the user's draft PR
      123058 (2026-10-21): drop this file when it lands.

  # USB/IP: TCP_NODELAY on the connections, a completion's data no longer
  # waits for the client to acknowledge its header (an FTDI read over USB/IP
  # on the bench got about twice as far with it)
  - path: zephyr/usbip-tcp-nodelay.patch
    sha256sum: 62a13cbc857cdc33294cea8311d02a96647ebd06776a7d9e4465e3a26096e5ad
    module: zephyr
    author: Benjamin Cabé
    email: benjamin@zephyrproject.org
    date: 2026-10-21
    upstreamable: true
    comments: |
      One commit, applies with or without usbip-removal-and-busid.patch.
      Tried on the bench (esptool read_flash through the FTDI, 2026-10-21).
      The same commit is the user's draft PR 123166 (2026-10-22): drop this
      file when it lands.

  # Sockets: a stream socket's receive window opens as recv() consumes the
  # data, not only when it returns: a recv() with MSG_WAITALL for more than
  # the window waited forever (USB/IP writes of over 4 KB on the bench)
  - path: zephyr/net-sockets-recv-window.patch
    sha256sum: 2f619074dbe7e192f3938684fc4df9dda70fde6c14eaed7d05677f3460a2ca9b
    module: zephyr
    author: Benjamin Cabé
    email: benjamin@zephyrproject.org
    date: 2026-10-26
    upstreamable: true
    comments: |
      Two commits: the fix (subsys/net/lib/sockets/sockets_inet.c) and an
      IPv4 and IPv6 test in tests/net/socket/tcp that fails without it (2 s
      timeout) and passes with it, the suite 67/67 on native_sim.  Zephyr's
      main still had the bug on 2026-10-26.  The same commits are the user's
      draft PR 123575 (2026-10-26): drop this file when it lands.

  # ESP32 Wi-Fi: the reason and signal of a lost station link logged as a
  # warning (the node's "bay fault"), and CONFIG_ESP32_WIFI_STA_LINK_HOLD_MS:
  # a lost link held, interface up and address kept, while the station
  # reconnects (firmware/common/Kconfig: 30 s)
  - path: zephyr/wifi-esp32-link-hold.patch
    sha256sum: 3ed820efc907b3e3ee71e639d30a3232cd65e742154c5136d84854802bfa15d3
    module: zephyr
    author: Benjamin Cabé
    email: benjamin@zephyrproject.org
    date: 2026-10-26
    upstreamable: true
    comments: |
      Two commits.  On the bench a home AP stopped its beacons for about 5 s
      now and then, two clients on different APs and bands dropped at the
      same second (reason 200, beacon timeout, RSSI -50), and the driver's
      dormant interface and stopped DHCP client took the address and every
      USB/IP session down.  With the address kept through a forced drop, a
      64 MB read went on.  Not proposed upstream (the user's call).

  # TCP: a connection keeps its negotiated MSS when later segments carry
  # options; one ACK with SACK blocks (the client's first loss) dropped it to
  # 536 bytes for the rest of the connection (a USB/IP read went from 700 to
  # 450 kB/s on the bench; with this, 1460 throughout and 740-770 kB/s again
  # after each loss)
  - path: zephyr/net-tcp-keep-mss.patch
    sha256sum: e6151fd5148e36e85e8bd0b12a9972a23d6fc51f0fcffb037ae966270fd19d2f
    module: zephyr
    author: Robert Lubos
    email: robert.lubos@nordicsemi.no
    date: 2026-10-14
    upstreamable: false
    comments: |
      A backport of upstream 0f138590a32, merged on 2026-10-16, 20 commits
      after the Zephyr pinned in firmware/west.yml: drop this file at the
      next bump.

  # Shell over telnet: a failed deferred send (ENOBUFS, ENETDOWN) ended the
  # connection from the send work, which then waited for itself: the system
  # work queue stopped for good, and with it telnet and the web server's
  # client timeouts (the bench XIAO after a Wi-Fi drop under USB/IP load)
  - path: zephyr/shell-telnet-send-work.patch
    sha256sum: 34abce4aaf8b0e58de3b71394938b5496dc876475a7254631066069283598b93
    module: zephyr
    author: Benjamin Cabé
    email: benjamin@zephyrproject.org
    date: 2026-10-26
    upstreamable: true
    comments: |
      Zephyr's main still had the bug on 2026-10-26.
