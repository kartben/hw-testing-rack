{#- Section / parent page / this page.  The section is the top bar's; a page shows its own title here, never the
    short one of the menu. -#}
<div class="sy-breadcrumbs" role="navigation">
  <div class="sy-breadcrumbs-inner flex items-center">
    <div class="md:hidden mr-3">
      <button class="js-menu bb-crumb-menu" aria-label="The pages of this section" type="button" aria-controls="lside" aria-expanded="false">
        <span>{{ bb_nav.title if bb_nav else 'Sections' }}</span><i class="i-lucide chevron-down"></i>
      </button>
    </div>
    <ol class="flex-1" itemscope itemtype="https://schema.org/BreadcrumbList">
      {%- for c in bb_crumbs %}
      <li{% if loop.first %} class="bb-crumb-section"{% endif %} itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <a itemprop="item" href="{{ c.url }}"><span itemprop="name">{{ c.title }}</span></a>
        <span>/</span>
        <meta itemprop="position" content="{{ loop.index }}" />
      </li>
      {%- endfor %}
      <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <strong itemprop="name">{{ title|striptags }}</strong>
        <meta itemprop="position" content="{{ bb_crumbs|count + 1 }}" />
      </li>
    </ol>
    <div class="xl:hidden ml-1">
      <button class="js-menu bb-crumb-toc" type="button" aria-controls="rside" aria-expanded="false">On this page</button>
    </div>
  </div>
</div>
