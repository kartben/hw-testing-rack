<figure class="bb-diagram">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="usbpath-t usbpath-d">
  <title id="usbpath-t">Where a board's USB and its power go</title>
  <desc id="usbpath-d">The row cable brings 20 V to the bay node's eFuse and meter, which sends it to the DATA board on the DATA lead. Each board has one USB cable to the DATA board. The DATA board's USB comes back on the DATA lead to a first USB switch in the bay node: to the ESP32-S3, which exports it over USB/IP, or, in classic mode, to a second switch and the laptop on the front port. The second switch can also give the front port to the ESP32-S3 (SERVICE). The ESP32-S3 reaches the network over Wi-Fi.</desc>
  <defs>
    <marker id="usbpath-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="d-head" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="d-group" x="500" y="10" width="345" height="320" rx="3"/>
  <text class="d-s" x="833" y="32" text-anchor="end">BAY NODE</text>

  <!-- power: row cable, eFuse, DATA board -->
  <path class="d-power" marker-end="url(#usbpath-a)" d="M150 52H520"/>
  <path class="d-power" marker-end="url(#usbpath-a)" d="M590 74V140H410"/>
  <text class="d-l" x="320" y="45" text-anchor="middle">20 V</text>
  <text class="d-l" x="505" y="132" text-anchor="middle">20 V, on the DATA lead</text>

  <!-- USB -->
  <path class="d-line" marker-end="url(#usbpath-a)" d="M150 162H240"/>
  <path class="d-line" marker-end="url(#usbpath-a)" d="M410 178H520"/>
  <path class="d-line" marker-end="url(#usbpath-a)" d="M630 178H700"/>
  <path class="d-line" marker-end="url(#usbpath-a)" d="M575 200V262"/>
  <path class="d-line" marker-end="url(#usbpath-a)" d="M630 284H735V212"/>
  <path class="d-line" marker-start="url(#usbpath-a)" d="M575 306V362"/>
  <path class="d-dash" marker-end="url(#usbpath-a)" d="M795 212V362"/>
  <text class="d-l" x="195" y="152" text-anchor="middle">a USB cable</text>
  <text class="d-l" x="195" y="180" text-anchor="middle">each</text>
  <text class="d-l" x="466" y="218" text-anchor="middle">USB, on the DATA lead</text>
  <text class="d-l" x="665" y="170" text-anchor="middle">USB/IP</text>
  <text class="d-l" x="585" y="236">classic mode</text>
  <text class="d-l" x="684" y="276" text-anchor="middle">SERVICE</text>
  <text class="d-l" x="786" y="300" text-anchor="end">Wi-Fi</text>

  <rect class="d-box" x="20" y="30" width="130" height="44" rx="3"/>
  <text class="d-t" x="85" y="57" text-anchor="middle">Row cable</text>

  <rect class="d-box" x="20" y="135" width="130" height="54" rx="3"/>
  <text class="d-t" x="85" y="167" text-anchor="middle">Your boards</text>

  <rect class="d-box" x="240" y="122" width="170" height="78" rx="3"/>
  <text class="d-t" x="325" y="148" text-anchor="middle">DATA board</text>
  <text class="d-s" x="325" y="168" text-anchor="middle">USB hub, a switch and</text>
  <text class="d-s" x="325" y="184" text-anchor="middle">a meter per port</text>

  <rect class="d-box" x="520" y="30" width="140" height="44" rx="3"/>
  <text class="d-t" x="590" y="57" text-anchor="middle">eFuse and meter</text>

  <rect class="d-box" x="520" y="156" width="110" height="44" rx="3"/>
  <text class="d-t" x="575" y="183" text-anchor="middle">USB switch</text>

  <rect class="d-box" x="700" y="144" width="130" height="68" rx="3"/>
  <text class="d-t" x="765" y="168" text-anchor="middle">ESP32-S3</text>
  <text class="d-s" x="765" y="186" text-anchor="middle">USB host,</text>
  <text class="d-s" x="765" y="201" text-anchor="middle">12 Mbit/s</text>

  <rect class="d-box" x="520" y="262" width="110" height="44" rx="3"/>
  <text class="d-t" x="575" y="289" text-anchor="middle">USB switch</text>

  <rect class="d-box" x="500" y="362" width="150" height="54" rx="3"/>
  <text class="d-t" x="575" y="385" text-anchor="middle">Laptop on the</text>
  <text class="d-t" x="575" y="403" text-anchor="middle">front port</text>
  <text class="d-s" x="488" y="385" text-anchor="end">its 5 V is sensed,</text>
  <text class="d-s" x="488" y="400" text-anchor="end">not used</text>

  <rect class="d-box" x="735" y="362" width="110" height="54" rx="27"/>
  <text class="d-t" x="790" y="394" text-anchor="middle">Network</text>
</svg>
</figure>
