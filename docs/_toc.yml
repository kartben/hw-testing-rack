# The site's navigation: the top bar's sections, their captions and their pages, in order.
# docs/_ext/bitbunk.py turns this file into the toctrees, the left-hand menu and the Next links.
# `nav` is the short title shown in the menu; the page keeps its own title everywhere else.

root: index
sections:
  - title: Plan
    index: plan/index
    index_nav: "How it works"
    parts:
      - caption: null
        pages:
          - {doc: plan/status, nav: "What exists today"}
          - {doc: plan/try-it-without-hardware, nav: "Try it without hardware"}
      - caption: "Decide and order"
        pages:
          - {doc: plan/stages, nav: "The build, stage by stage"}
          - {doc: plan/cost-and-time, nav: "Cost and time"}
          - {doc: plan/choose-your-rack, nav: "Choose a size, change the layout"}
          - {doc: plan/order-the-pcbs, nav: "Order the PCBs"}
          - {doc: plan/shopping-list, nav: "Shopping list and tools"}
  - title: Print
    index: print/index
    index_nav: "Measure before you print"
    parts:
      - caption: null
        pages:
          - {doc: print/printer-and-settings, nav: "Printer, filament, settings"}
          - {doc: print/stl-files, nav: "Get the STL files"}
          - {doc: print/parts-list, nav: "Parts and quantities"}
          - {doc: print/inserts-and-nuts, nav: "Inserts and square nuts"}
  - title: Build
    index: build/index
    index_nav: "Tools, and what cannot be undone"
    parts:
      - caption: "While the PCBs are on their way"
        pages:
          - {doc: build/get-the-firmware, nav: "Build or download the firmware"}
          - {doc: build/row-cables, nav: "Make the row cables"}
      - caption: "The PCBs on the bench"
        pages:
          - {doc: build/solder-the-connectors, nav: "Solder the connectors"}
          - doc: build/check-the-pcbs/index
            nav: "Check each PCB"
            children:
              - {doc: build/check-the-pcbs/power-hub, nav: "Power hub"}
              - {doc: build/check-the-pcbs/bay-node, nav: "Bay node"}
              - {doc: build/check-the-pcbs/camera-pod, nav: "Camera pod"}
              - {doc: build/check-the-pcbs/data-x6, nav: "DATA ×6"}
              - {doc: build/check-the-pcbs/data-x4, nav: "DATA ×4"}
              - {doc: build/check-the-pcbs/rack-bus, nav: "Hub and two nodes"}
          - {doc: build/flash, nav: "Flash the hub and the nodes"}
      - caption: "Assemble"
        pages:
          - {doc: build/fit-out-a-tray, nav: "Fit out a tray"}
          - {doc: build/screw-the-rack-to-the-bench, nav: "Screw the rack to the bench"}
          - {doc: build/first-bay, nav: "The frame and the first bay"}
          - {doc: build/add-a-bay, nav: "Add a bay, then a row"}
          - {doc: build/camera, nav: "Add a camera"}
      - caption: "Power and network"
        pages:
          - {doc: build/power-box, nav: "Power box and charger"}
          - {doc: build/bring-the-rack-online, nav: "Bring the rack online"}
      - caption: "A smaller build"
        pages:
          - {doc: build/one-bay-on-a-desk, nav: "One bay on a desk"}
  - title: Use
    index: use/index
    index_nav: "What a bay can do"
    parts:
      - caption: null
        pages:
          - {doc: use/take-over-a-rack, nav: "Take over a rack you did not build"}
          - {doc: use/first-session, nav: "A first session with a bay"}
          - {doc: use/names, nav: "Bays, ports and addresses"}
          - {doc: use/set-up-your-machine, nav: "Set up bayctl and usbip"}
      - caption: "Boards in bays"
        pages:
          - {doc: use/mount-a-board, nav: "Put a board in a bay"}
          - {doc: use/add-a-board, nav: "A board that is not in the library"}
          - {doc: use/board-targets, nav: "Board targets"}
      - caption: "Every day"
        pages:
          - {doc: use/rack-page, nav: "Rows and the rack's page"}
          - {doc: use/power-and-reset, nav: "Power-cycle or reset a board"}
          - {doc: use/power-budget, nav: "Power budget and queued ports"}
          - {doc: use/usb-and-flashing, nav: "USB/IP and flashing"}
          - {doc: use/serial-console, nav: "Serial console"}
          - {doc: use/wires, nav: "Wires between boards"}
          - {doc: use/logic-analyzer, nav: "Logic analyzer"}
          - {doc: use/camera, nav: "Camera"}
          - {doc: use/front-port, nav: "Front port and classic mode"}
      - caption: "In CI"
        pages:
          - {doc: use/ci-host, nav: "Set up a CI host"}
          - {doc: use/twister, nav: "Zephyr twister"}
          - {doc: use/labgrid-and-lava, nav: "labgrid and LAVA"}
      - caption: "Sharing a rack"
        pages:
          - {doc: use/access, nav: "Access rules and security"}
          - {doc: use/reserve-a-bay, nav: "Reserve a bay"}
      - caption: "Keeping it running"
        pages:
          - {doc: use/update-firmware, nav: "Update the firmware"}
          - {doc: use/wifi, nav: "Wi-Fi in the rack"}
          - {doc: use/service-a-bay, nav: "Take out a tray, a node or a DATA board"}
          - {doc: use/recover, nav: "Recover a node or a hub"}
          - {doc: use/troubleshooting, nav: "Troubleshooting"}
  - title: Reference
    index: reference/index
    index_nav: "Every action, four ways"
    parts:
      - caption: null
        pages:
          - {doc: reference/glossary, nav: "Glossary"}
      - caption: "Command line and API"
        pages:
          - {doc: reference/bayctl, nav: "bayctl"}
          - {doc: reference/node-shell, nav: "Bay node shell"}
          - {doc: reference/node-api, nav: "Bay node HTTP API"}
          - {doc: reference/hub-shell, nav: "Power hub shell"}
          - {doc: reference/hub-api, nav: "Power hub HTTP API"}
          - {doc: reference/network, nav: "Network ports, names, metrics"}
          - {doc: reference/tools, nav: "build.py, plate_layout.py, bom.py"}
      - caption: "Files"
        pages:
          - {doc: reference/rack-yaml, nav: "rack.yaml"}
          - {doc: reference/lab-yaml, nav: "lab.yaml"}
          - {doc: reference/board-library, nav: "Board library"}
      - caption: "Lights and messages"
        pages:
          - {doc: reference/leds-and-buttons, nav: "LEDs, buttons and switches"}
          - {doc: reference/states-and-messages, nav: "States and error messages"}
      - caption: "Limits"
        pages:
          - {doc: reference/specifications, nav: "Specifications"}
          - {doc: reference/known-limitations, nav: "Known issues, and what will not work"}
      - caption: "Hardware"
        pages:
          - doc: reference/pcbs/index
            nav: "The five PCBs"
            children:
              - {doc: reference/pcbs/power-hub, nav: "Power hub"}
              - {doc: reference/pcbs/bay-node, nav: "Bay node"}
              - {doc: reference/pcbs/camera-pod, nav: "Camera pod"}
              - {doc: reference/pcbs/data-x6, nav: "DATA ×6"}
              - {doc: reference/pcbs/data-x4, nav: "DATA ×4"}
          - {doc: reference/cables, nav: "Cables and pinouts"}
          - {doc: reference/bill-of-materials, nav: "Bill of materials"}
  - title: Engineering
    quiet: true            # last in the bar, and drawn quieter than the five before it
    index: engineering/index
    index_nav: "Why it is built this way"
    parts:
      - caption: "Work on BitBunk"
        pages:
          - {doc: engineering/contribute, nav: "Contribute"}
          - {doc: engineering/change-a-pcb, nav: "Change a PCB"}
          - {doc: engineering/work-on-the-firmware, nav: "Work on the firmware"}
          - {doc: engineering/tools, nav: "Regenerate the site, the viewer, the renders, the drawings"}
          - {doc: engineering/licences-and-credits, nav: "Licences and credits"}
      - caption: "Design documents"
        pages:
          - {doc: mechanical, nav: "Frame and bay: mechanical design"}
          - {doc: electronics, nav: "Electronics design log"}
          - {doc: power, nav: "Power: negotiation, budget, protection"}
          - {doc: can, nav: "Rack bus on CAN"}
          - {doc: rack-protocol, nav: "Rack bus protocol, version 1"}
          - {doc: firmware, nav: "Firmware: design, status, open items"}
          - {doc: multi-dut-node, nav: "One node, several boards"}
          - {doc: bench, nav: "Bench stand-ins: plans and measurements"}
          - {doc: boards-3d, nav: "3D models of the dev boards"}
      - caption: "Studies and reviews"
        pages:
          - doc: engineering/studies
            nav: "Studies and reviews"
            groups:
              - caption: "Printed parts and frame"
                pages:
                  - {doc: printed-parts-review, nav: "Printed parts: design review (2026-10-21)"}
                  - {doc: printed-parts-fdm-review, nav: "Printed parts: what the slicer says (2026-10-21)"}
                  - {doc: stability, nav: "Can the rack tip over? (2026-10-25)"}
              - caption: "Power and row wiring"
                pages:
                  - {doc: power-distribution-review, nav: "Row wiring and a shorter hub"}
                  - {doc: rj45-row-cable-feasibility, nav: "Row bus on RJ45: electrical"}
                  - {doc: rj45-row-cable-mechanical, nav: "Row bus on RJ45: mechanical"}
                  - {doc: power-profiling-research, nav: "Microamp power profiling"}
              - caption: "DATA ×4: wires and analyzer"
                pages:
                  - {doc: data-x4-v2-research, nav: "Why the DATA ×4 is built this way"}
                  - {doc: data-x4-v2-layout-options, nav: "A standing board: layout options"}
                  - {doc: data-x4-logic-usability-review, nav: "Pin headers: usability review"}
                  - {doc: coproc-firmware-research, nav: "The co-processor's firmware"}
                  - {doc: debug-probe-research, nav: "An SWD probe through the matrix (not built)"}
              - caption: "Wi-Fi and the node's MCU"
                pages:
                  - {doc: wifi-capacity-ns3, nav: "How much one Wi-Fi channel carries"}
                  - {doc: wifi-coexistence, nav: "Rack Wi-Fi and the boards' Bluetooth"}
                  - {doc: mcu-alternatives, nav: "Another MCU for the node?"}
                  - {doc: esp32-s31-research, nav: "The ESP32-S31"}
                  - {doc: wired-node-mcu, nav: "A wired node"}
              - caption: "PCB reviews before the order"
                pages:
                  - {doc: review-konnect, nav: "Node and hub, rev 0.2 to 0.5 (16-19 October)"}
                  - {doc: pcba-review, nav: "Assembly review (19 October)"}
                  - {doc: datasheet-audit, nav: "Datasheet audit: node, hub, camera pod"}
                  - {doc: datasheet-audit-data-x4-v2, nav: "Datasheet audit: DATA ×4"}
                  - {doc: schematic-review-2026-10-25, nav: "Schematic review (25 October)"}
                  - {doc: pcb-review-2026-11-09, nav: "Design review of the v1.0 PCBs (9 November, in French)"}
              - caption: "Fabs, parts and routing"
                pages:
                  - {doc: jlc-parts-audit, nav: "Parts, prices and three fabs compared (October 2026)"}
                  - {doc: autorouting-benchmark, nav: "Autorouting benchmark"}

