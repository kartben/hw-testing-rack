name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip install -r tools/requirements.txt
      - name: OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad fonts-liberation
      - name: Viewer assets (meshes, scene, BOM)
        # PCB models come from the committed site/assets/pcb/*.glb (KiCad export, see tools/pcb_glb.py)
        run: python tools/build.py web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
