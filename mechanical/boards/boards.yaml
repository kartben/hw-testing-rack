# Dev-board library used to generate board plates and the 3D viewer stand-ins.
#
# Coordinates are given exactly as in the vendor's mechanical drawing:
# origin = bottom-left corner of the PCB outline, X along `size[0]`.
# `usb.edge` is the edge (top/bottom/left/right of that drawing) carrying the
# debug USB connector; `usb.pos` its centre along that edge (from left for
# top/bottom, from bottom for left/right).  tools/build.py rotates every board
# so that this connector faces the REAR of the drawer, where the drawer's
# DATA port is.
#
# `verified: false` means the outline or holes come from secondary sources:
# such boards get a "fence" plate (corner fences, no screws) until someone
# measures the real hole pattern — PRs welcome.
#
# standoff     = plate-to-PCB distance (Nucleo morpho pins stick out underneath!)
# height       = tallest component above the PCB (viewer only)
# fence        = true → hole-less corner-fence mounting
# orient: side = turn the debug USB towards the drawer's right wall; the board then sits to the
#                left of its plate.  For a board too long for a plug behind it, and for a small
#                one: its cable is then straight at both ends and lies flat (docs/cabling.md)
# zephyr       = CI defaults for tools/bayctl.py (twister hardware map): `platform` is the target
#                as twister names it (the board YAML's `identifier`), `runner` the west runner,
#                `console` usb (the debugger's VCOM, default) or aux (the bay's AUX UART).
#                Board families list `choices`: config/lab.yaml picks one per bay.

boards:
  arduino-uno-r4:
    name: Arduino UNO R4 Minima / WiFi (UNO R3 footprint)
    short: UNO R4
    size: [68.58, 53.34]
    holes: [[13.97, 2.54], [15.24, 50.80], [66.04, 7.62], [66.04, 35.56]]
    hole_d: 3.2
    usb: { edge: left, pos: 41.0, type: usb-c }
    orient: side            # small: a straight cable, flat, from the right DATA socket
    standoff: 6
    height: 11
    color: "#00878f"
    source: "Arduino ABX00080 datasheet, mechanical drawing"
    verified: true
    zephyr: { choices: ["arduino_uno_r4@minima", "arduino_uno_r4@wifi"], runner: pyocd,
              note: "the UNO R4 WiFi's ESP32-S3 is its CMSIS-DAP probe and USB console; the Minima has neither: SWD probe, console on AUX" }

