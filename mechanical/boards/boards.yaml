# Dev-board library used to generate board plates and the 3D viewer stand-ins.
#
# Coordinates are given exactly as in the vendor's mechanical drawing:
# origin = bottom-left corner of the PCB outline, X along `size[0]`.
# `usb.edge` is the edge (top/bottom/left/right of that drawing) carrying the
# debug USB connector; `usb.pos` its centre along that edge (from left for
# top/bottom, from bottom for left/right).  tools/build.py rotates every board
# so that this connector faces the REAR of the drawer, where the drawer's
# DATA port is.
#
# `verified: false` means the outline or holes come from secondary sources:
# such boards get a "fence" plate (corner fences, no screws) until someone
# measures the real hole pattern — PRs welcome.
#
# standoff     = plate-to-PCB distance (Nucleo morpho pins stick out underneath!)
# height       = tallest component above the PCB (viewer only)
# fence        = true → hole-less corner-fence mounting
# orient: side = turn the debug USB towards the drawer's right wall; the board then sits to the
#                left of its plate.  For a board too long for a plug behind it, and for a small
#                one: its cable is then straight at both ends and lies flat (docs/cabling.md)
# pegs         = the honeycomb plate's pegs (tools/plate_layout.py): `keepout`, [edge, from, to] in the drawing
#                frame (edge and positions as usb counts them), spans of the outline no peg may touch: a header
#                or a connector at the edge, pins under it.  The debug USB's plug is kept out by itself.
# zephyr       = CI defaults for tools/bayctl.py (twister hardware map): `platform` is the target
#                as twister names it (the board YAML's `identifier`), `runner` the west runner,
#                `console` usb (the debugger's VCOM, default) or aux (the bay's AUX UART).
#                Board families list `choices`: config/lab.yaml picks one per bay.
# headers      = 2.54 mm pin headers soldered pins up, where Dupont jumpers plug on (viewer: the pins, and the
#                jumpers' ends): rows of `n` pins from pin `at` [x, y] (drawing frame) by `step` [dx, dy], their
#                `names` in order (a name may repeat, GND: a jumper takes the one nearest its other end)

boards:
  arduino-uno-r4:
    name: Arduino UNO R4 Minima / WiFi (UNO R3 footprint)
    short: UNO R4
    size: [68.58, 53.34]
    holes: [[13.97, 2.54], [15.24, 50.80], [66.04, 7.62], [66.04, 35.56]]
    hole_d: 3.2
    usb: { edge: left, pos: 41.0, type: usb-c }
    orient: side            # small: a straight cable, flat, from the right DATA socket
    pegs: { keepout: [[left, 2, 16], [top, 17, 66], [bottom, 26, 66], [right, 30, 48]] }   # jack; headers; ICSP, Qwiic
    standoff: 6
    height: 11
    color: "#00878f"
    source: "Arduino ABX00080 datasheet, mechanical drawing"
    verified: true
    zephyr: { choices: ["arduino_uno_r4@minima", "arduino_uno_r4@wifi"], runner: pyocd,
              note: "the UNO R4 WiFi's ESP32-S3 is its CMSIS-DAP probe and USB console; the Minima has neither: SWD probe, console on AUX" }

  giga-r1-display:
    name: Arduino GIGA R1 WiFi + GIGA Display Shield
    short: GIGA + display
    # The shield's Samtec strips plug into the GIGA's two HLE sockets: the shield sits 7.5 mm over the
    # GIGA's top face, its 3.97" display (480 × 800) facing up, away from the GIGA.  Drawing frame: the
    # shield's outline (it covers the GIGA), the GIGA's underside at z = 0, its USB-C edge on the left.
    size: [106.0, 80.0]
    holes: []
    fence: true             # the GIGA's Mega holes are under the shield: corner fences until the plate holds the stack
    usb: { edge: left, pos: 50.2, type: usb-c }   # J12 (CX90B-16P), 0.9 mm proud of the GIGA's edge
    standoff: 5             # the GIGA's underside: the USB-A shell's tabs reach 1.9 mm below it
    height: 14.5            # top of the display above the GIGA's PCB
    color: "#00878f"
    screen: { at: [9.8, 15.58], size: [86.4, 51.84], px: [480, 800], top: -x, z: 16.21, demo: music }   # portrait, top at the USB edge
    model:                  # tools/board_models.py stacks Arduino's two STEP files (tools/fetch_render_assets.py)
      stack:
        - { src: giga-r1-wifi }
        - { src: giga-display-shield, rot_x: 180, at: [-0.16, 69.28, 7.53] }   # strips into sockets, measured on the models
      offset: [0.16, 10.72, 1.68]
      recolour: { "#003700": "#00828a" }   # the STEP's generic green PCBs → Arduino's teal
      web: true             # CC BY-SA 4.0: the viewer's copy is published, with credit (docs/boards-3d.md)
      credit: "© Arduino S.r.l., CC BY-SA 4.0 (stacked, recoloured, simplified)"
    source: "Arduino STEP files ABX00063 + ASX00039 (CC BY-SA 4.0); datasheets ABX00063, ASX00039"
    verified: true
    zephyr: { platform: arduino_giga_r1/stm32h747xx/m7, runner: dfu-util,
              note: "build with --shield arduino_giga_display_shield (LVGL samples run on it); dfu-util needs the bootloader: double-tap RESET (AUX RESET)" }

  nucleo-64:
    name: ST NUCLEO-64 (MB1136 / MB1367)
    short: NUCLEO-64
    size: [70.0, 82.5]
    holes: [[10.87, 54.61], [59.13, 53.34], [43.89, 2.54]]
    hole_d: 3.2
    usb: { edge: top, pos: 47.0, type: micro-b }    # MB1136 = mini-B, MB1367 = micro-AB
    pegs: { keepout: [[left, 4, 60], [right, 4, 60]] }        # the morpho headers' pins under the long edges
    standoff: 12
    height: 12
    color: "#f2f2f2"
    source: "ST UM1724 fig. 5 (holes drawing-derived, ±0.1 mm)"
    verified: true
    zephyr: { choices: [nucleo_c031c6, nucleo_f401re, nucleo_f446re, nucleo_g071rb, nucleo_g474re, nucleo_l476rg],
              runner: stm32cubeprogrammer }

  nucleo-144:
    name: ST NUCLEO-144 (MB1137 / MB1364 / MB1404)
    short: NUCLEO-144
    size: [70.0, 133.34]
    holes: [[10.87, 105.41], [59.13, 104.14], [43.89, 53.34], [12.14, 29.21], [57.86, 29.21]]
    hole_d: 3.2
    usb: { edge: top, pos: 49.0, type: micro-b }    # MB1404 (H5) uses USB-C
    pegs: { keepout: [[left, 15, 112], [right, 15, 112]] }    # the morpho headers' pins under the long edges
    standoff: 12
    height: 14
    color: "#f2f2f2"
    source: "ST UM1974 fig. 6 (holes drawing-derived)"
    verified: true
    zephyr: { choices: [nucleo_f429zi, nucleo_f767zi, nucleo_h563zi, nucleo_h743zi, nucleo_u575zi_q],
              runner: stm32cubeprogrammer }

  rpi-pico2:
    name: Raspberry Pi Pico / Pico 2 (W)
    short: PICO 2
    size: [21.0, 51.0]
    headers:                # pins 1–20 down the left (USB at the top), 21–40 up the right, the SWD three at the bottom
      - { at: [1.61, 49.63], step: [0, -2.54], n: 20,
          names: [GP0, GP1, GND, GP2, GP3, GP4, GP5, GND, GP6, GP7, GP8, GP9, GND, GP10, GP11, GP12, GP13, GND, GP14, GP15] }
      - { at: [19.39, 1.37], step: [0, 2.54], n: 20,
          names: [GP16, GP17, GND, GP18, GP19, GP20, GP21, GND, GP22, RUN, GP26, GP27, GND, GP28, ADC_VREF, 3V3,
                  3V3_EN, GND, VSYS, VBUS] }
      - { at: [7.96, 1.6], step: [2.54, 0], n: 3, names: [SWCLK, GND, SWDIO] }
    holes: [[4.8, 2.0], [16.2, 2.0], [4.8, 49.0], [16.2, 49.0]]
    hole_d: 2.1
    usb: { edge: top, pos: 10.5, type: micro-b }
    orient: side            # small: a straight cable, flat, from the right DATA socket
    pegs: { keepout: [[left, 0, 51], [right, 0, 51]] }        # headers along both long edges: a pin through a hole
    standoff: 9
    height: 4
    color: "#1e7b34"
    source: "Raspberry Pi Pico 2 datasheet"
    model: { web: true, credit: "Pico 2 model © Raspberry Pi Ltd, MIT (simplified)" }
                            # Raspberry Pi's STEP (tools/fetch_render_assets.py), MIT: the viewer's copy is published
    pcb_t: 1.0
    verified: true
    zephyr: { platform: rpi_pico2/rp2350a/m33_0, runner: uf2, console: aux,
              note: "no on-board probe: uf2 needs BOOTSEL (AUX BOOT to TP6, AUX RESET to RUN) and an automounted RP2350 drive; or add a Raspberry Pi Debug Probe (runner openocd)" }

  esp32-s3-devkitc:
    name: Espressif ESP32-S3-DevKitC-1 v1.1
    short: ESP32-S3
    size: [25.4, 62.74]
    holes: []
    fence: true
    usb: { edge: bottom, pos: 12.7, type: micro-b }  # two micro-B (UART + USB-OTG)
    orient: side            # small: a straight cable, flat, from the right DATA socket
    pegs: { keepout: [[left, 0, 62.74], [right, 0, 62.74], [bottom, 0, 25.4]] }   # headers; both USB ports
    standoff: 10            # header pins underneath
    height: 8
    color: "#151515"
    source: "Espressif DXF ESP32-S3-DevKitC-1 v1.1"
    verified: true
    zephyr: { platform: esp32s3_devkitc/esp32s3/procpu, runner: esp32 }

  esp32-c6-devkitc:
    name: Espressif ESP32-C6-DevKitC-1 v1.2
    short: ESP32-C6
    size: [25.4, 51.8]
    headers:                # J1 down the left, J3 down the right, from the module's end (the USB-Cs at the bottom)
      - { at: [1.27, 45.8], step: [0, -2.54], n: 16, names: [3V3, RST, IO4, IO5, IO6, IO7, IO0, IO1, IO8, IO10, IO11,
                                                              IO2, IO3, 5V, GND, NC] }
      - { at: [24.13, 45.8], step: [0, -2.54], n: 16, names: [GND, TX, RX, IO15, IO23, IO22, IO21, IO20, IO19, IO18,
                                                               IO9, GND, IO13, IO12, GND, NC] }
    holes: []
    fence: true
    usb: { edge: bottom, pos: 12.7, type: usb-c }    # two USB-C
    orient: side            # small: a straight cable, flat, from the right DATA socket
    pegs: { keepout: [[left, 0, 51.8], [right, 0, 51.8], [bottom, 0, 25.4]] }     # headers; both USB ports
    standoff: 10
    height: 8
    color: "#151515"
    source: "Espressif dimension drawing v1.2"
    verified: true
    zephyr: { platform: esp32c6_devkitc/esp32c6/hpcore, runner: esp32 }

  xiao:
    name: Seeed Studio XIAO (any)
    short: XIAO
    size: [17.78, 20.96]    # its USB-C on a short edge, seven pins down each long one (Seeed's XIAO ESP32C3 v1.3 KiCad)
    holes: []
    fence: true
    usb: { edge: top, pos: 8.89, type: usb-c }
    headers:                # top view, USB at the top: D0–D6 down the left, 5V GND 3V3 D10–D7 down the right
      - { at: [1.27, 18.03], step: [0, -2.54], n: 7, names: [D0, D1, D2, D3, D4, D5, D6] }
      - { at: [16.51, 18.03], step: [0, -2.54], n: 7, names: [5V, GND, 3V3, D10, D9, D8, D7] }
    standoff: 6
    height: 4
    color: "#202a44"
    source: "Seeed wiki"
    model: { web: true, offset: [0, 0.76], credit: "XIAO ESP32S3 model © Seeed Studio, CC BY-SA 4.0 (simplified)" }
                            # Seeed's STEP (tools/fetch_render_assets.py), CC BY-SA 4.0:
                            # the viewer's copy is published (its USB-C overhang had shifted the outline)
    pcb_t: 1.25             # its PCB's thickness (viewer: the headers sit on it)
    verified: true
    zephyr: { choices: [xiao_ble, xiao_esp32c3, xiao_esp32c6/esp32c6/hpcore, xiao_esp32s3/esp32s3/procpu, xiao_rp2040],
              note: "pick the runner with the platform (esp32, uf2, ...)" }

  microbit-v2:
    name: BBC micro:bit v2
    short: MICRO:BIT
    size: [51.6, 42.0]
    holes: []
    fence: true
    usb: { edge: top, pos: 25.8, type: micro-b }
    pegs: { keepout: [[bottom, 0, 51.6]] }                    # the edge connector
    standoff: 6
    height: 6
    color: "#111111"
    source: "Mouser listing (outline only)"
    verified: true
    zephyr: { platform: bbc_microbit_v2, runner: pyocd }

