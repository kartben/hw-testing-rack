    hole_d: 3.2
    usb: { edge: top, pos: 47.0, type: micro-b }    # MB1136 = mini-B, MB1367 = micro-AB
    standoff: 12
    height: 12
    color: "#f2f2f2"
    source: "ST UM1724 fig. 5 (holes drawing-derived, ±0.1 mm)"
    verified: true
    zephyr: { choices: [nucleo_c031c6, nucleo_f401re, nucleo_f446re, nucleo_g071rb, nucleo_g474re, nucleo_l476rg],
              runner: stm32cubeprogrammer }

