    hole_d: 3.2
    usb: { edge: top, pos: 49.0, type: micro-b }    # MB1404 (H5) uses USB-C
    standoff: 12
    height: 14
    color: "#f2f2f2"
    source: "ST UM1974 fig. 6 (holes drawing-derived)"
    verified: true

  rpi-pico2:
    name: Raspberry Pi Pico / Pico 2 (W)
    short: PICO 2
    size: [21.0, 51.0]
    holes: [[4.8, 2.0], [16.2, 2.0], [4.8, 49.0], [16.2, 49.0]]
    hole_d: 2.1
    usb: { edge: top, pos: 10.5, type: micro-b }
    standoff: 9
