# Sysbuild: MCUboot in front of the bay node firmware, for the updates over
# the network (docs/build/get-the-firmware.md, docs/build/flash.md).  `west build --sysbuild`.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# Swap using offset (sysbuild's default): a test boot, and MCUboot goes
# back to the previous image unless the new one confirms itself
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
