# MCUboot for the bay node (sysbuild adds this to MCUboot's configuration).
#
# A bootloader has no use for these, and MCUboot (no threads) cannot link
# what some boards turn on in their defconfig:
#  - m5stack_stamps3: PWM (the ESP32 MCPWM driver);
#  - m5stack_cores3: regulators, I2C and the touch panel (input), whose fixed
#    regulators and touch lines sit on its AW9523B expander.
CONFIG_PWM=n
CONFIG_REGULATOR=n
CONFIG_INPUT=n
CONFIG_I2C=n
