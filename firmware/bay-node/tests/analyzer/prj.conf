# The logic analyzer relay on native_sim (see CMakeLists.txt)
# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_LOG=y
CONFIG_BAY_LOG_LEVEL_INF=y

# The host on the virtual bus, with the node's transfers and buffers
CONFIG_USB_HOST_STACK=y
CONFIG_UHC_DRIVER=y
CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=4096
# The analyzer on it (src/cdc_emu.c)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_BUF_POOL_SIZE=8192
# The virtual bus runs on the system clock (as tests/subsys/usb/host)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000
