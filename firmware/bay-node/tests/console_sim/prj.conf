# Bay node console on native_sim (see CMakeLists.txt)
# SPDX-License-Identifier: Apache-2.0

# Networking through the host's own sockets: no TAP, no root
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="bay-b3"
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=16

# The node's web server and console settings, except for the client slots:
# the server frees an idle client with shutdown(SHUT_RD) and waits for poll()
# to report it, which host sockets (NSOS) never do, so a browser's keep-alive
# connections would hold the node's 3 slots for good.  8 slots fit Chrome's 6
# connections per host plus the console's WebSocket.
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=3
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=512
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_WEBSOCKET_MAX_CONTEXTS=2
CONFIG_JSON_LIBRARY=y
CONFIG_PROMETHEUS=y

# AUX UART: the second PTY UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_GPIO=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
