# The DATA x4's pin matrix on native_sim (see CMakeLists.txt)
# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_BAY_LOG_LEVEL_INF=y
CONFIG_JSON_LIBRARY=y
# Short cycles: the test waits for them
CONFIG_BAY_POWER_CYCLE_MS=200
CONFIG_BAY_BOOTLOADER_HOLD_MS=20
CONFIG_BAY_PORTS_DISCHARGE_MS=500
# The INA226 nodes need their driver for the emulator to attach (never initialized)
CONFIG_SENSOR=y
# The matrix: its MUX driver (firmware/common) on the expander's
CONFIG_BAY_WIRES=y
