CONFIG_ZTEST=y
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_BAY_LOG_LEVEL_INF=y
# The INA226 nodes need their driver for the emulator to attach (never initialized)
CONFIG_SENSOR=y
# The test switches DATA_VIN on itself
CONFIG_BAY_DATA_POWER_AT_BOOT=n
