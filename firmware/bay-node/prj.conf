# hw-testing-rack bay node
# SPDX-License-Identifier: Apache-2.0

# --- Peripherals ------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LED_STRIP=y
CONFIG_INPUT=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# --- Persistent settings: bay id, forced mode, Wi-Fi credentials, access ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Networking (Wi-Fi station, IPv4, DHCP, mDNS) ----------------------------
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
# No driver retry: hwtr_net retries every 10 s, so "wifi scan" works between tries
# while the AP is unreachable
CONFIG_WIFI_CREDENTIALS=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="bay"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_MDNS_RESPONDER=y

# Sockets and descriptors: see NET_MAX_CONTEXTS in Kconfig (more with the camera)
# The AUX console thread polls 2 listeners, 2 TCP clients and 2 web consoles;
# the HTTP server its eventfd, its listener and its clients (2 + 6)
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48

# --- Access control: TCP filter (local-in hook), signed admin requests ------
CONFIG_NET_PKT_FILTER=y
CONFIG_NET_PKT_FILTER_LOCAL_IN_HOOK=y
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
# X-Bay-Auth: a 98-character value (header values longer than the limit are dropped)
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=112
CONFIG_HTTP_SERVER_CAPTURE_HEADER_BUFFER_SIZE=128
CONFIG_HTTP_SERVER_CAPTURE_HEADER_COUNT=1

# --- USB host + USB/IP -------------------------------------------------------
CONFIG_USB_HOST_STACK=y
CONFIG_USBIP=y
# A DATA ×4 bay: the hub, 4 boards, the v2 co-processor, a spare (docs/multi-dut-node.md)
CONFIG_USBH_USB_DEVICE_MAX=8
# (USB/IP buffer pool: 48 KB, see Kconfig)

# --- Shell: UART test pads and telnet (port 23) -----------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
# A pasted line ("wifi cred add ...") arrives in one go: room for it
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256

# --- Web page, JSON API, /metrics (HTTP/1.1, port 80) -----------------------
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
# HTTP/1.1 only: one HTTP/2 stream context per client, not 10 (180 B each)
CONFIG_HTTP_SERVER_MAX_STREAMS=1
# A browser loading the page opens up to 6 connections at once (the page, its
# CSS and script, /api/status, /api/events); one over the limit is closed
# unanswered, and the page comes up without its CSS
CONFIG_HTTP_SERVER_MAX_CLIENTS=6
# A browser keeps several keep-alive connections open and, with all client
# slots taken, the server stops accepting: drop idle ones quickly so the
# console's WebSocket (and anyone else) gets in.  The page polls every 2 s.
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=3
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=512
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_JSON_LIBRARY=y
CONFIG_PROMETHEUS=y
# Web console: /console/ws/<n>, one WebSocket context per console
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_WEBSOCKET_MAX_CONTEXTS=2

# --- Logging, stacks ---------------------------------------------------------
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Rack bus (docs/rack-protocol.md): CAN on the row cable, POS token -------
CONFIG_CAN=y
CONFIG_HWTR_RACK_NODE=y
CONFIG_HWTR_NET=y
CONFIG_REBOOT=y

# Access rules and the admin key (firmware/common, shared with the hub)
CONFIG_HWTR_ADMIN=y
