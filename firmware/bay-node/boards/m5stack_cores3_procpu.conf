# M5Stack CoreS3 stand-in (see the overlay)

# 8 MB of quad PSRAM (GPIO35-37 are the display's SPI: not octal)
CONFIG_ESP_SPIRAM=y

# The AW9523B (the DUT's VBUS switch, the boost enable) and the AXP2101 on the
# internal bus
CONFIG_MFD=y
CONFIG_REGULATOR=y

# Bench board: stack and heap headroom from the shell (kernel thread stacks,
# kernel heap), kernel reboot
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_REBOOT=y
