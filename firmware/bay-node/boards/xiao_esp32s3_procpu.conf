# Seeed XIAO ESP32-S3 stand-in (see the overlay)

# The ESP32-S3R8's 8 MB of octal PSRAM: the node's own configuration
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# Bench board: stack and heap headroom from the shell (kernel thread stacks,
# kernel heap), kernel reboot
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_REBOOT=y
# Why it last restarted ("hwinfo reset_cause" over telnet): the console is the
# USB host's once it runs, so a panic is not seen
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=y
# Every heap ("heaps" over telnet): the system heap, the Wi-Fi's in PSRAM,
# the USB/IP pool
CONFIG_SYS_HEAP_ARRAY_SIZE=8
# Each thread's share of the CPU ("kernel thread list")
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
