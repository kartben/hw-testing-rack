# SPDX-License-Identifier: Apache-2.0

description: |
  The USB PD contract of an AP33772S sink, as a regulator: the voltages are
  the source's fixed PDOs (list_voltage), set_voltage requests one (or a
  PPS/AVS voltage inside the range), the current limit is the operating
  current requested, enable/disable drive the output switch.  Callbacks:
  REGULATOR_VOLTAGE_DETECTED when a contract is in place,
  REGULATOR_VOLTAGE_REMOVED when it is lost.

  regulator-min/max-microvolt bound what may ever be requested.

compatible: "diodes,ap33772s-regulator"

include:
  - base.yaml
  - name: regulator.yaml
    property-allowlist:
      - regulator-boot-on
      - regulator-min-microvolt
      - regulator-max-microvolt
      - regulator-max-microamp
