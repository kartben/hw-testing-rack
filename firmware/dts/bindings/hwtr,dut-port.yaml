# SPDX-License-Identifier: Apache-2.0

description: |
  Power and control lines towards the board under test (DUT) on a
  hw-testing-rack bay node: the TPS2553 current-limited VBUS switch, the
  INA226 that measures it, and the AUX connector (UART + open-drain
  RESET/BOOT lines driven through 2N7002 N-FETs).

  On a DATA x4 board (docs/multi-dut-node.md) there is one node per port,
  its lines on the board's TCA6408A expanders, its INA226 on the board:
  those chips run from DUT_5V, so the firmware talks to them only while
  DUT_5V is on, and sets them up again after each DUT_5V on.

  Example:

    dut_port: dut-port {
        compatible = "hwtr,dut-port";
        enable-gpios = <&gpio0 6 GPIO_ACTIVE_HIGH>;
        fault-gpios = <&gpio0 7 (GPIO_ACTIVE_LOW | GPIO_PULL_UP)>;
        reset-gpios = <&gpio0 11 GPIO_ACTIVE_HIGH>;
        boot-gpios = <&gpio0 12 GPIO_ACTIVE_HIGH>;
        power-monitor = <&ina226>;
        uart = <&uart1>;
    };

compatible: "hwtr,dut-port"

properties:
  enable-gpios:
    type: phandle-array
    required: true
    description: |
      TPS2553 EN.  Active = DUT VBUS on.  The bay node pulls EN up, so the
      DUT is powered before (and without) any firmware: the firmware must
      keep the line in its current state when it configures it.  With
      vin-efuse, the eFuse's SHDN instead, pulled down: off until the
      firmware's checks pass.
      DATA x4: EN is pulled down, every port is off until the firmware
      switches it on, one at a time, within the bay's budget (the
      admission rule); after each DUT_5V on, every port is off again.

  fault-gpios:
    type: phandle-array
    required: true
    description: |
      TPS2553 ~FAULT (open drain, pulled up on the board).  Active while the
      switch is in current limit or thermal shutdown (7.5 ms deglitch).

  reset-gpios:
    type: phandle-array
    description: |
      Gate of the N-FET on the AUX RESET line.  Active = the DUT's RESET
      line is pulled low (DUT held in reset).  Pulled down on the board.
      DATA x4: the line itself, on an expander pin, with a 100k pull-up:
      asserted by configuring the pin as an output low, released by
      configuring it as an input (it then reads 1).

  boot-gpios:
    type: phandle-array
    description: |
      Gate of the N-FET on the AUX BOOT line.  Active = the DUT's BOOT strap
      line is pulled low.  Pulled down on the board.  DATA x4: as
      reset-gpios.

  power-monitor:
    type: phandle
    description: Sensor (INA226) measuring the DUT VBUS voltage and current.

  vin-efuse:
    type: boolean
    description: |
      Node v1.0: enable-gpios drives the SHDN of a TPS26600 eFuse on the
      rack's VIN (20-28 V), out on the DATA lead as DATA_VIN, and
      power-monitor reads DATA_VIN.  SHDN is pulled down: off without
      firmware.  The firmware switches it on only after the checks of the
      DATA lead's power-on rule (docs/firmware.md), and off until the next
      power on after a fault, a DATA board that stops answering or none at
      all.  fault-gpios is the eFuse's ~FLT, also low while it is off or
      ramping.

  bus-gpios:
    type: phandle-array
    description: |
      With vin-efuse: SCL then SDA of the I2C bus out on the DATA lead,
      only read (the pins stay the I2C controller's).  Both must idle high
      before the eFuse goes on: a lead plugged the wrong way round holds
      SCL low.

  uart:
    type: phandle
    description: UART wired to the AUX connector (DUT console).

  sub-slot:
    type: int
    description: |
      DATA board: the port's number, 1-4 on a DATA x4, 1-6 on a DATA x6,
      port 1 leftmost from the DUT side (sub-slot <bay>.<n>,
      config/rack.yaml).

  hub-port:
    type: int
    description: |
      DATA board: the hub's downstream port wired to it; the USB/IP busid
      is 1-1.<hub-port>.  DATA x4: the sub-slot.  DATA x6: 6 for sub-slot
      1, n - 1 for sub-slot n.

  tx-gpios:
    type: phandle-array
    description: |
      The UART's TX pin seen as a GPIO.  The firmware takes the pin from the
      UART to release it (input) while the DUT is powered off, so the node
      does not feed the board through its RX pin, and to hold it low for a
      BREAK; it hands the pin back to the UART afterwards.
