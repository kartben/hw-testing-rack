# USB hub spike (README.md): a hub, up to 4 DUTs, USB/IP over Wi-Fi
# SPDX-License-Identifier: Apache-2.0

CONFIG_GPIO=y
CONFIG_SERIAL=y

# Settings: the Wi-Fi credentials stored with "wifi cred add"
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Wi-Fi station, DHCP, mDNS: usbspike-<mac>.local (firmware/common/lib/net.c)
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="usbspike"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_MDNS_RESPONDER=y
CONFIG_HWTR_NET=y
# USB/IP listener + 4 sessions, DHCP, mDNS, shell, spare
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48

# USB host, its hub class, USB/IP with one session per DUT
CONFIG_USB_HOST_STACK=y
CONFIG_USBH_HUB_CLASS=y
CONFIG_USBH_HUB_INSTANCES_COUNT=2
# The hub, 4 DUTs, a DATA ×4 v2 co-processor, a spare
CONFIG_USBH_USB_DEVICE_MAX=8
CONFIG_USBH_USB_DEVICE_HEAP=4096
CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=4096
CONFIG_USBIP=y
CONFIG_USBIP_DEVICES_COUNT=4

# Shell on the UART connector: spike, wifi, net, kernel
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y

# What the spike is for: the host stack, its hub and USB/IP, with timestamps
CONFIG_LOG=y
CONFIG_USBH_LOG_LEVEL_INF=y
CONFIG_USBH_HUB_LOG_LEVEL_INF=y
CONFIG_USBIP_LOG_LEVEL_INF=y
CONFIG_UHC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
