# DATA ×4 v2 co-processor spike (README.md): build only, no hardware yet

CONFIG_LOG=y
CONFIG_SHELL=y

# USB: 4 CDC-ACM (shell + 3 consoles) and the node's vendor bulk link
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_LOG_LEVEL_WRN=y
# The shell runs on a CDC-ACM port: its driver may not log to itself
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UDC_BUF_POOL_SIZE=4096
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Emulated I2C devices: the TMP103 and EEPROM targets turn on from the devicetree
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_SENSOR=y
CONFIG_ADC=y
# The TMP103 target reads the die temperature sensor, which starts at 90:
# upstream's default (60) fails the init-order check (README.md)
CONFIG_I2C_TARGET_INIT_PRIORITY=91

# Capture: PIO + DMA
CONFIG_DMA=y
