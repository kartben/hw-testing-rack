# M5Stack CoreS3 stand-in (see the overlay)

# The CoreS3's own power chips on its internal bus (AXP2101, AW9523B: the
# board's regulators need them)
CONFIG_MFD=y

# Bench board: stack and heap headroom from the shell, kernel reboot
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_REBOOT=y
