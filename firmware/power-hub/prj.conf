# hw-testing-rack power hub
# SPDX-License-Identifier: Apache-2.0

# --- Peripherals ------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_LED=y
CONFIG_CAN=y
CONFIG_INPUT=y
CONFIG_SERIAL=y

# --- Persistent settings: rack id, PD choice, rows, shed order, Wi-Fi --------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Networking (Wi-Fi station, IPv4, DHCP, mDNS) ----------------------------
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_WIFI_CREDENTIALS=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="rack"
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_MDNS_RESPONDER=y

# HTTP listener + 3 clients, DHCP, mDNS, spare
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12

# --- Shared code (firmware/common) --------------------------------------------
CONFIG_HWTR_NET=y
CONFIG_HWTR_RACK_HUB=y
# The page's actions are admin requests, signed with a key claimed with BOOT
CONFIG_HWTR_ADMIN=y

# --- Shell: console USB-C (USB-Serial-JTAG) only ----------------------------
# No telnet: switching rows is for the admin, and the shell has no login of
# its own; the console USB-C is physical access
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_REBOOT=y

# --- Web page, JSON API, /metrics (HTTP/1.1, port 80) -----------------------
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
# A browser keeps keep-alive connections open; with all client slots taken
# the server stops accepting: drop idle ones quickly (the page polls every 2 s)
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=3
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=512
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_JSON_LIBRARY=y
# Admin requests: X-Bay-Auth, an 81-character value (header values longer
# than the limit are dropped)
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=112
CONFIG_HTTP_SERVER_CAPTURE_HEADER_BUFFER_SIZE=128
CONFIG_HTTP_SERVER_CAPTURE_HEADER_COUNT=1

# --- Logging, stacks ---------------------------------------------------------
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
