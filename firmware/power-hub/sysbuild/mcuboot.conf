# MCUboot for the power hub (sysbuild adds this to MCUboot's configuration).
#
# A bootloader has no use for these, and MCUboot (no threads) cannot link
# what the m5stack_cores3 stand-in's board turns on: regulators, I2C and the
# touch panel (input), whose fixed regulators and touch lines sit on its
# AW9523B expander.
CONFIG_REGULATOR=n
CONFIG_INPUT=n
CONFIG_I2C=n
