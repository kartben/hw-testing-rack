CONFIG_ZTEST=y

# The mDNS responder on a loopback interface, as Zephyr's own tests run it
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="bay-b3"
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

CONFIG_HWTR_DNSSD=y
CONFIG_HWTR_DNSSD_REFRESH_MS=100
