# USB/IP on native_sim (see CMakeLists.txt)
# SPDX-License-Identifier: Apache-2.0

# The service on the virtual host controller, two export contexts
CONFIG_USB_HOST_STACK=y
CONFIG_UHC_DRIVER=y
CONFIG_USBIP=y
CONFIG_USBIP_DEVICES_COUNT=2
CONFIG_USBIP_READ_AHEAD=y
# The bay node's pool, smaller than a mass storage request: those go through
# it in 4 KB transfers, their data in the system heap
CONFIG_USBIP_BUF_POOL_SIZE=49152
CONFIG_USBIP_SEGMENT_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=262144

# The device on the virtual bus: the loopback class (bulk endpoints in
# interface 0, alternate 1), the serial converter (src/serial_emu.c) and the
# mass-storage-like function (src/storage_emu.c)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_LOOPBACK_CLASS=y
CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_SAMPLE_USBD_PRODUCT="USB/IP test device"

# Networking through the host's own sockets: no TAP, no root
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_ZVFS_OPEN_MAX=16

# The shell on stdin: "dut off", "dut on"
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="sim:~$ "

CONFIG_LOG=y
CONFIG_ASSERT=y
