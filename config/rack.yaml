# hw-testing-rack — single source of truth for the shelf geometry.
#
# Everything is in millimetres.  Frame coordinates: X = left→right (width),
# Y = front→back (depth), Z = up, origin = front-left-bottom corner of the
# leftmost base ladder.  The structure is the PANEL FRAME: printed ladders
# (side walls shared by neighbouring bays) stacked row on row, trays sliding
# into their grooves, an X brace behind every bay and row (see docs/mechanical.md).
# Shelves are tilted ("stadium"): each row is a module in its own ROW
# coordinates (X same, Y along the slope towards the back, Z perpendicular to
# the shelf), rotated by `frame.tilt` about X so the front edge is lower.
# "Carrier coordinates" = row coordinates shifted to the front-left corner of
# one bay's tray.
#
# `tools/build.py` turns this file into:
#   mechanical/generated/config.scad   (OpenSCAD constants)
#   site/assets/rack.json              (3D viewer scene: instances + cables)
# and the electronics generators read the `pcb:` section so that the board
# outlines, mounting holes and connector positions always match the prints.

frame:
  tilt: 20               # shelf tilt in degrees (front edge lower) — 0 gives flat shelves
  row_origin_y: 25       # frame Y of every row's front-bottom edge
  base_height: 80        # base ladders: floor → row A's origin (floor plates in between)
  panel_thickness: 7.4   # ladder thickness (X); one ladder between neighbouring bays
  panel_clearance: 0.2   # tray wall ↔ ladder face, per side

bay:
  width: 158             # tray outer width (X); the column pitch adds a ladder and two clearances (165.8)
  depth: 210             # tray depth along the slope
  carrier:
    bottom: 2.5          # bottom plate (= ceiling of the bay below)
    wall: 2.0
    standoff: 5.0        # bay-node PCB standoff height above the bottom plate
    pcb_to_floor: 14.0   # PCB top surface → bay floor surface (deck top)
    deck: 3.0            # removable deck plate thickness
    fascia: 2.5          # front wall thickness
  camera_mount: [100, 60, 30]   # insert-pattern centre X, Y and square pitch, carrier coords
                                # (rows are staggered by height·sin(tilt): this lands mid-bay below)

drawer:
  depth: 196             # outer, front panel included
  travel: 140            # pull-out stroke (the drag chain keeps the DUT connected)
  guide_width: 7.5       # each side rail on the deck (C-channel capturing the drawer flange)
  clearance: 0.5         # per side, drawer ↔ guide
  bottom: 2.5
  wall: 2.0
  wall_height: 16        # side/rear walls above the drawer bottom
  front_height: 30       # front panel height above the deck
  front_thickness: 4
  rear_bay: 30           # enclosed strip at the back: the DATA port board + cable entry
  data_ports: [0.80]     # the DATA port's USB-C mouth on the port wall (× drawer width): its board on the
                         # rear-bay floor, left of the chain foot's lock screw
  aux_port: 0.50             # slot for the optional AUX (JST-SH) pigtail
  flange: [3.0, 3.0]     # runner flange (width, height) captured by the guides
  magnet: [6, 3]         # closed-position detent magnet Ø × t (one in drawer, one in deck)
  plate: 2.5             # board plate thickness

chain:                   # drag chain lying flat in the plenum (bends in the XY plane)
                         # reference: Olimex DRAG-CHAIN-7X7, links open on both sides.  Olimex gives
                         # only the inner size; outer size and end holes are Electrokit's figures for
                         # the same generic chain (art. 41017996).  Measure yours on arrival.
  inner: [7, 7]          # 7×7 mm, the common 3D-printer size
  outer: [13.5, 10.2]    # across the side plates (= vertical here) × in the bend plane (= X here)
  radius: 18             # bend radius to the chain centre line: not published, measure it
  pitch: 16              # link pitch of the printable link (parts/chain_parts.scad) and the viewer
  end_holes: [8, 4]      # end pieces: 2 holes 8 mm apart on a tab flush with the outer face of the U,
                         # the first one 4 mm from the mouth (M2.5 self-tapping + washer)
  end_length: 26         # rigid end piece, mouth → its pivot on the chain: it must stay in a straight
                         # run over the whole stroke (checked in lib/carrier.scad).  Measure it.
  fixed: [100, 87]       # fixed end (the end piece's mouth), carrier XY
  moving_x: 136          # X of the moving run (the drawer foot)
  moving_y: 157          # moving end's mouth, measured from the drawer front face
  foot_y: 172            # the foot's lock screw (in the drawer's rear bay), from the drawer front face
  bend_y: 183            # centre of the U bend (closed drawer)

rows:                     # bottom → top; each row is an independent module
  - id: A
    height: 165           # vertical pitch to the next row's origin
    layout: [1, 1, 1, 1]  # single bays (double-width bays are not designed for the panel frame yet)
  - id: B
    height: 165
    layout: [1, 1, 1, 1]
  # a third row (C) is one more entry like these: the hub has 4 row outputs (2 rows to start, 2026-10-18)

cameras:                  # bays that get a camera pod on their ceiling (the tray above, or the cap plate)
  - B2

power_box:                # mechanical/parts/power_box.scad: the power hub's enclosure, in a base cell under row A
  column: 0               # base cell (under row A) it sits in: its floor sockets take the floor plate's bosses
  x: 3                    # its left outer face from the cell's left (the row cables leave through the ladder window)
  size: [84, 148, 35]     # outer W × D × H: the hub (76 × 140) and its tallest part (the 100 µF bulk capacitor)
  wall: 2.4
  charger:                # outside the rack, on the USB-C PD input in the box's rear wall
    part: "USB PD 3.1 EPR charger, 140 W (28 V × 5 A), single port"
    cable: "USB-C to USB-C cable, 5 A, e-marked (EPR 240 W rated), 1–2 m"

# Example population used by the docs, the BOM roll-up and the 3D viewer.
# board ids refer to mechanical/boards/boards.yaml; cable ids to cables below.
population:
  A1: { board: nucleo-64,        cable: c-to-micro-b }
  A2: { board: nucleo-144,       cable: c-to-micro-b }
  A3: { board: nrf52840-dk,      cable: c-to-micro-b }
  A4: { board: nrf54l15-dk,      cable: c-to-c }
  B1: { board: frdm-mcxn947,     cable: c-to-c }
  B2: { board: giga-r1-display,  cable: c-to-c }                   # the camera bay: a live LVGL screen (2026-10-18)
  B3: { board: rpi-pico2,        cable: c-to-micro-b-straight, open: true }    # drawer shown pulled out
  B4: { board: arduino-uno-r4,   cable: c-to-c-straight, pc_cable: true }      # "classic" mode: laptop on the front port

cables:
  # DUT cables (DATA socket → board), `length` end to end.  A board whose USB faces the port wall: a
  # right-angle USB-C at the socket and, at the board, a right-angle USB-C (style right) or, micro-B and
  # mini-B not being reversible, a 90° adapter with the cable's straight plug standing on it (style
  # adapter): an arch over the board's rear edge.  A small board turned to the side wall (orient: side):
  # straight plugs at both ends, one flat bend (style straight).  A long one turned to it (the
  # F746G-DISCO): its straight plug fits beside it, bends up and arches over to the socket (style side).
  c-to-c:       { label: "USB-C 90° ↔ USB-C 90°, 15 cm",        a: usb-c, b: usb-c,   length: 150 }
  c-to-micro-b: { label: "USB-C 90° ↔ micro-B straight, 25 cm, on a micro-B 90° adapter", a: usb-c, b: micro-b,
                  length: 250, style: adapter }
  c-to-mini-b:  { label: "USB-C 90° ↔ mini-B straight, 25 cm", a: usb-c, b: mini-b,
                  length: 250, style: side }       # the F746G-DISCO: its USB faces the side wall, 49 mm away
  c-to-c-straight:       { label: "USB-C ↔ USB-C, straight, 15–20 cm", a: usb-c, b: usb-c,   length: 150, style: straight }
  c-to-micro-b-straight: { label: "USB-C ↔ micro-B, straight, 15–20 cm", a: usb-c, b: micro-b, length: 150, style: straight }
  data-lead:    { label: "JST PH 5-pin DATA lead, pin n ↔ pin 6−n, 400–500 mm (node J7 → DATA port board)", length: 400 }
  row-jumper:   { label: "JST PH 6-pin row cable, 1:1, 24 AWG, 120 mm", length: 120 }
  row-feed:     { label: "JST PH 6-pin feed, 1:1, 24 AWG (VRACK, CAN, POS)", length: 600 }

pcb:
  bay_node:
    size: [64, 90]          # X × Y; KiCad y=0 is the REAR edge, y=90 the front edge (grown 10 mm at the rear for
                            # the WROOM-1 module: every y below moved by 10, the board's front and holes stay put)
    thickness: 1.6
    layers: 4
    x0: 4                   # left edge, carrier X
    front_gap: 0.5          # PCB front edge → fascia inner face
    holes: [[3.5, 13.5], [60.5, 13.5], [3.5, 86.5], [60.5, 86.5]]   # M3, KiCad coordinates (the tray's standoffs unchanged)
    front: { pc_port: 32, led: 12, svc: 50 }        # KiCad X of the front-edge parts
    pwr_y: 73               # KiCad Y of the row cable connectors (JST PH 6, left/right edges)
    right: { dut: 34, aux: 50 }                     # KiCad Y of J4 (DUT USB-C, right edge) and J5 (AUX, vertical PH 6)
    cam: [43, 67]           # J6, the camera lead (JST PH 8, vertical: plugged from above), its centre, KiCad
  power_hub:                # v0.5: USB-C PD in (AP33772S), eFuses, rack controller (ESP32-S3, CAN master)
    size: [76, 140]         # X × Y; KiCad y=0 is the REAR edge, y=140 the front edge (like the bay node)
    thickness: 1.6
    layers: 4               # as the bay node: In1 solid GND, In2 power only, signals outside
    holes: [[3.5, 3.5], [72, 4], [4, 127.2], [72, 127.2]]   # M3, KiCad coordinates (the front pair clears the LEDs and USB-C)
    x0: 3.6                 # left edge, box X (the row connectors' mouths reach into the left wall)
    front_gap: 1.2          # PCB front edge -> box front wall inner face
    z: 19.0                 # PCB bottom above the box bottom: the row connectors clear the base ladder's window sill
    rows: [115, 92, 69, 46] # KiCad y of the row A, B, C, D connectors (6-pin JST PH, side entry, left edge)
    front: { leds: [11, 23, 35, 47, 55.6, 61.6], usb: 70 }  # KiCad x: ON/FAULT pair centres (±3) for rows A-D, then PD (the AP33772S's status), CTL; USB-C
    rear: { pd: 62 }            # KiCad x on the rear edge: the USB-C PD input
    buttons: [[11.5, 10.0], [11.5, 16.5]]   # KiCad: SW1 RESET, SW2 BOOT (design.py), top-actuated, 1.5 mm tall: pin holes in the lid
  data_port:                # the drawer's DATA port: a USB-C source on a small board on the drawer's rear-bay floor
    size: [40, 17]          # X × Y; KiCad y=0 is the REAR edge (the 5-pin PH lead to the node), y=17 the FRONT edge (USB-C mouth)
                            # ≤ 17 deep: the PH plug and the wires' turn down fit in the drawer's 30 mm rear bay
    thickness: 1.6
    layers: 2
    holes: [[3.0, 8.5], [37.5, 4.0]]     # Ø2.7, PT 2.6 × 8 from above into the drawer's floor bosses; mounted components up
    usb: 30.5               # KiCad x of the USB-C (GCT USB4105) on the front edge: the right edge ≤ 9.5 mm right of it (the
                            # chain foot's lock screw); its centre 1.63 mm above the component face (3.23 above the underside)
    ph: 17.5                # KiCad x of the JST PH 5-pin (side entry) on the rear edge: its courtyard clear of the USB4105's (x ≤ 17.6)
  camera_pod:               # the board in each camera pod, beside the Arducam Mega, mounted components (LEDs) down
    size: [40, 27]          # X × Y; KiCad y=0 is the edge beside the camera (the LEDs), x=40 the lead's edge
    thickness: 1.6
    layers: 2
    holes: [[2.6, 13.0], [26.5, 23.5]]   # Ø2.7, PT 2.6 into the printed pod
    leds: [5, 11, 17, 23]   # KiCad x of the four white 2835 LEDs, at y = led_y
    led_y: 3.2
    lead: 13                # KiCad y of J1 (JST PH 8, side entry) on the right edge, its mouth facing +x
    header: [13, 21]        # J2 (1 × 6, 2.54 mm, pins out of the component face): its centre, pin 1 at x − 6.35
